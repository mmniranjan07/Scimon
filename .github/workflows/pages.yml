name: Deploy web build to GitHub Pages

# Builds the game to WebAssembly with pygbag and publishes it at
# https://<your-user>.github.io/<repo-name>/   (Settings -> Pages -> Source: "GitHub Actions")
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pygbag
        run: pip install pygbag
      - name: Stage only what the game needs (no tests/tools)
        run: |
          mkdir -p stage
          cp main.py stage/
          cp ./*.py stage/ 2>/dev/null || true
          cp -r assets stage/assets
      - name: Build WebAssembly bundle
        run: python -m pygbag --build --archive stage
      - name: Prepare Pages artifact
        run: |
          mkdir -p site/play site/img
          cp -r stage/build/web/* site/play/          # the game itself lives at /play/
          cp web/index.html site/index.html           # the landing page
          # monster art for the landing page (MPWSP01 sprites, named after the species they represent)
          for pair in aquabit:13 cindermite:7 florabot:2 pyrodrive:8 sparkit:11 nanolyte:10; do
            cp "assets/mpw/mon/${pair#*:}_front.png" "site/img/${pair%%:*}-front.png"
          done
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
